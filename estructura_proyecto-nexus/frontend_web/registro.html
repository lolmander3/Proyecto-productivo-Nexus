<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x icon " href="/img/usuario.png"/>
    <link rel="stylesheet" href="/estructura_proyecto-nexus/frontend_web/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="  bg-light d-flex justify-content-center align-items-center vh-100 flex-column"> 
<header class="head">
    <style>
        .head{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
    </style>
    <nav class="navbar navbar-expand-lg bg-success border-bottom ">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4  text-light" href="index.html">Nexus</a>
        </div>
    </nav>
</header>
<div class="bg-white p-3 p-md-5 rounded-5 shadow-sm card-register mx-2">
    
    <div class="mb-4">
        <a href="index.html" class="text-decoration-none text-secondary d-flex align-items-center gap-2" style="font-size: 0.9rem;">
            <span>&#8592;</span> Volver al inicio
        </a>
    </div>

    <div class="text-center mb-4">
        <h2 class="fw-bold mb-0 ">Crear Cuenta</h2>
        <p class="text-muted small">Únete a la comunidad Nexus</p>
    </div>

    <form>
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Nombre completo</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-secondary">
                    <i class="bi bi-person"></i> </span>
                <input type="text" class="form-control bg-light border-start-0" placeholder="Tu nombre">
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Correo electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-secondary">
                    <i class="bi bi-envelope"></i> </span>
                <input type="email" class="form-control bg-light border-start-0" placeholder="tu@email.com">
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label small fw-bold">Tipo de cuenta</label>
            <select class="form-select bg-light" style="border: 1.5px solid var(--verde-nexus);">
                <option selected>Usuario</option>
                <option value="1">Empresa</option>
            </select>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label small fw-bold">Confirmar contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-secondary">
                    <i class="bi bi-lock"></i> </span>
                <input type="password" class="form-control bg-light border-start-0" placeholder="........">
            </div>
        </div>

        <button type="button" class="btn btn-nexus w-100 fw-bold py-2 shadow-sm mb-3">
            Crear cuenta
        </button>

        <div class="text-center">
            <span class="small text-secondary">¿Ya tienes una cuenta?</span>
            <a href="login.html" class="text-decoration-none fw-bold small" style="color: var(--verde-nexus);"> Iniciar sesión</a>
        </div>
    </form>
</div>
