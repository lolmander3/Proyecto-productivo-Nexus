<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x icon " href="/img/usuario.png"/>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="  bg-light d-flex justify-content-center align-items-center vh-100 flex-column"> 

  <div class="bg-white p-5 rounded-5 shadow-sm card-login ">
        
        <div class="mb-4">
      <a href="index.html" class="text-decoration-none text-dark d-flex align-items-center gap-2 mt-3" style="font-size: 0.9rem;">
        <i class="bi bi-arrow-left"></i> Volver al inicio
    </a>
  </div>

        <div class=" d-flex justify-content-center">
            <img 
                src="img/usuario.png" 
                alt="login-icon" 
                class="rounded-circle shadow-sm"
                style="height: 7rem; object-fit: cover; border: 6px solid  white;"/>
        </div>

        <div class=" text-center fs-3 fw-bold ">Iniciar sesion </div>
        <div class="input-group mt-3">

    <span class="input-group-text bg-secondary">
        <img src="img/username-icon.svg" 
             style="height: 1.2rem;"/>
    </span>

    <input type="text" class="form-control bg-light" placeholder="Username"/>
</div>


         <div class="input-group mt-1">
             <div class="input-group-text bg-secondary border-end-0 ">
                <img src="img/password-icon.svg" alt="password-icon" style="height: 1rem;"/>
             </div>

        
            <input type="password" class="form-control bg-light border-start-0" placeholder="Password"/>
        </div>
           


        <div class="d-flex justify-content-between align-items-center mt-1 w-100 ">
            <div class="d-flex align-items-center gap-1">
                <input class="form-check-input mt-0" type="checkbox" id="checkRecordar" /> 
                <label for="checkRecordar" style="font-size: 0.9rem; cursor: pointer;">Recordarme</label>
                
            
            </div>
            <div class="pt-1">
            <a href="#" class="text-decoration-none text-primary fst-italic " style="font-size: 0.9rem;">Olvidaste tu contraseña?</a>
            </div>
        </div>
  
        <button id="btnLogin" class="mt-4 text-center btn btn-success w-100">Iniciar sesion</button>

        <div class="mt-1 d-flex gap-3  justify-content-center">
        <div> No tienes cuenta?</div>
            <a href="#" class=" registrar fst-italic text-decoration-none text-primary">Registrarse</a>
        </div>

        <div class="my-2 text-center">o</div>

        <div class=" btn d-flex align-items-center justify-content-center border">
            <img src="img/google-icon.svg" alt="google-icon" style="height: 1.6rem;" class="me-2"/>
            <div class="fw-semibold text secondary">Iniciar sesion con google</div>
        </div>

    </div>
<script>
// Usuarios válidos (simulados)
const usuariosValidos = [
    { email: "admin@nexus.com", password: "admin123", nombre: "Administrador" },
    { email: "usuario@nexus.com", password: "usuario123", nombre: "Usuario" }
];

document.getElementById('btnLogin').addEventListener('click', function() {
    const email = document.querySelector('input[placeholder="Username"]').value;
    const password = document.querySelector('input[placeholder="Password"]').value;
    
    const usuario = usuariosValidos.find(u => u.email === email && u.password === password);
    
    if (usuario) {
        // Generar JWT simulado
        const token = btoa(JSON.stringify({
            email: usuario.email,
            nombre: usuario.nombre,
            exp: Date.now() + 3600000
        }));
        
        localStorage.setItem('auth_token', token);
        localStorage.setItem('user_data', JSON.stringify(usuario));
        
        // Redirigir al panel administrativo
        window.location.href = 'panel_administrativo.html';
    } else {
        alert('Correo o contraseña incorrectos');
    }
});
</script>

          
</body>
</html>
